name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: Build release binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run release-build "$RELEASE_TAG"
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/agentctl-darwin-amd64
            dist/agentctl-darwin-arm64
            dist/agentctl-linux-amd64
            dist/agentctl-linux-arm64
            dist/SHA256SUMS
            install.sh
