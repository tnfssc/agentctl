version: "2"

linters:
  enable:
    - errorlint
    - nilerr
    - forcetypeassert
    - durationcheck
    - gocritic
    - revive
    - misspell
    - perfsprint
    - unconvert
    - gosec
    - bidichk
    - noctx
  settings:
    gosec:
      excludes:
        - G101 # flags env var *names* like ANTHROPIC_AUTH_TOKEN as credentials
        - G304 # every file we read is a config path we computed, by design
  exclusions:
    presets: [std-error-handling]
    rules:
      # Tests own the model type; a failed assertion should panic loudly.
      - path: _test\.go
        linters: [forcetypeassert]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/tnfssc/agentctl]
