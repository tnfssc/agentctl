[tools]
go = "1.26.10"
golangci-lint = "2.15.0"

[env]
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build bin/agentctl"
run = "go build -trimpath -ldflags \"-s -w -X github.com/tnfssc/agentctl/internal/cli.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) -X github.com/tnfssc/agentctl/internal/cli.commit=$(git rev-parse --short HEAD 2>/dev/null)\" -o bin/agentctl ./cmd/agentctl"

[tasks.release-build]
description = "Build release binaries and SHA256SUMS (pass vX.Y.Z)"
run = "sh scripts/release-build.sh"

[tasks.install]
# Where install.sh puts it, not $GOBIN: mise's Go sets GOBIN to its own toolchain directory, which comes first on PATH
# and would shadow the installed agentctl.
description = "Install agentctl where install.sh does: $AGENTCTL_INSTALL_DIR, else ~/.local/bin"
run = "go build -trimpath -ldflags \"-X github.com/tnfssc/agentctl/internal/cli.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) -X github.com/tnfssc/agentctl/internal/cli.commit=$(git rev-parse --short HEAD 2>/dev/null)\" -o \"${AGENTCTL_INSTALL_DIR:-$HOME/.local/bin}/agentctl\" ./cmd/agentctl"

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Vet and lint"
run = ["go vet ./...", "golangci-lint run"]

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test", "build"]

[tasks.demo]
description = "Record the README GIFs with VHS (needs ttyd and ffmpeg); TAPES=name to record some"
run = """
set -e
for tape in ${TAPES:-demo cliproxy t3 opencode tune phone}; do
  . docs/demo/setup.sh /tmp/agentctl-demo
  trap 'kill $(cat /tmp/agentctl-demo/proxy.pid /tmp/agentctl-demo/cliproxy.pid 2>/dev/null) 2>/dev/null || true' EXIT
  mise exec vhs@0.12.1 -- vhs docs/demo/$tape.tape
  kill $(cat /tmp/agentctl-demo/proxy.pid /tmp/agentctl-demo/cliproxy.pid 2>/dev/null) 2>/dev/null || true
done
"""
